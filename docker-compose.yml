services:
  postgres:
    image: postgres:16-alpine
    container_name: undreseller_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-undreseller}
    ports:
      - "5432:5432"
    volumes:
      - undreseller_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-undreseller}"]
      interval: 3s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 4096M
        reservations:
          memory: 2048M

volumes:
  undreseller_pgdata:
