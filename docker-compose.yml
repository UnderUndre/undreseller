# ─── Docker Memory Fencing (business plan v2.5.0 §2.5, spec 001-reinit NFR-103) ───
# Production app-сервис (Next.js + Payload) добавляется спекой 002+ (deploy, с Dockerfile).
# Инвариант: app-инстанс ≤ 500 MB RAM. Шаблон для будущего сервиса:
#
#   app:
#     build: .
#     restart: unless-stopped
#     environment:
#       DATABASE_URL: postgres://postgres:postgres@postgres:5432/undreseller
#       PAYLOAD_SECRET: ${PAYLOAD_SECRET}
#     depends_on:
#       postgres:
#         condition: service_healthy
#     deploy:
#       resources:
#         limits:
#           memory: 500M
#         reservations:
#           memory: 256M
#
services:
  postgres:
    image: postgres:16-alpine
    container_name: undreseller_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-undreseller}
    ports:
      - "5432:5432"
    volumes:
      - undreseller_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-undreseller}"]
      interval: 3s
      timeout: 3s
      retries: 10
    deploy:
      resources:
        limits:
          memory: 4096M
        reservations:
          memory: 2048M

volumes:
  undreseller_pgdata:
